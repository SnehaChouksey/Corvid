# Local dev/test infrastructure only. Production Postgres is a managed tier (ADR-D9, Unit 0);
# this exists so the schema, Better Auth, and the LangGraph checkpointer can be built and tested
# against a real Postgres without external provisioning.
services:
  postgres:
    image: postgres:17-alpine
    container_name: corvid-postgres
    environment:
      POSTGRES_USER: corvid
      POSTGRES_PASSWORD: corvid
      POSTGRES_DB: corvid
    ports:
      - '5432:5432'
    volumes:
      - corvid-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U corvid -d corvid']
      interval: 5s
      timeout: 3s
      retries: 10

  # Local dev/test Redis: crawl frontier + dedup cache (02 §8), and the gateway rate-limit store.
  # Production Redis is a managed tier (ADR-D9, Unit 0); this exists so the frontier/dedup and the
  # Redis-backed rate limiter can be built and tested against a real Redis without provisioning.
  redis:
    image: redis:7-alpine
    container_name: corvid-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  corvid-pgdata:
